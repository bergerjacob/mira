# accelerate launch --config_file training/sft/hpc/accelerate_zero3.yaml ...   (1 node x 8 GPUs; set num_machines/main_process_ip for more)
compute_environment: LOCAL_MACHINE
distributed_type: DEEPSPEED
deepspeed_config:
  deepspeed_config_file: training/sft/hpc/ds_zero3.json
  zero3_init_flag: true
machine_rank: 0
main_training_function: main
mixed_precision: bf16
num_machines: 1
num_processes: 8
rdzv_backend: static
same_network: true
use_cpu: false
