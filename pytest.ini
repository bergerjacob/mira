[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
markers =
    server: requires a running Minecraft server (RCON on localhost:25575)
    api: requires OPENROUTER_API_KEY (makes real LLM API calls, costs money)
    slow: slow tests (>10 seconds)
    stability: stability tests (repeated execution for reliability verification)
